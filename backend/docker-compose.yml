services:
  web:
    build: .
    container_name: fastapi_web
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      FILES_PATH: /lub/storage/
    volumes:
      - file_storage:/lub/storage/
  
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --console-address ":9001" /data

volumes:
  postgres_data:
  file_storage:
  minio_data: